<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digi Help Media · CRM</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%235b4dff'/><text x='16' y='22' font-size='16' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'>D</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="locked">
  <!-- Login / reset password screen -->
  <div class="auth" id="auth"></div>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo">D</div>
        <div>
          <div class="brand-name">Digi Help Media</div>
          <div class="brand-sub">Lead CRM</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a href="#/dashboard" data-route="dashboard"><span class="ico">▦</span>Dashboard</a>
        <a href="#/leads" data-route="leads"><span class="ico">☰</span>Leads<span class="nav-badge" id="badge-new"></span></a>
        <a href="#/followups" data-route="followups"><span class="ico">⏰</span>Follow-ups<span class="nav-badge warn" id="badge-fu"></span></a>
        <a href="#/team" data-route="team" data-admin><span class="ico">👥</span>Team</a>
        <a href="#/whatsapp" data-route="whatsapp"><span class="ico">💬</span>WhatsApp Templates</a>
        <a href="#/integrations" data-route="integrations" data-admin><span class="ico">⚡</span>Integrations</a>
        <a href="#/settings" data-route="settings" data-admin><span class="ico">⚙</span>Settings</a>
      </nav>
      <div class="sidebar-foot">
        <div class="sync-pill" id="sync-pill" title="Google Sheet sync status">Sheet: not connected</div>
        <div class="sync-pill" id="cloud-pill" title="Team cloud sync status">Team sync: off</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menu-btn" aria-label="Menu">☰</button>
        <h1 id="page-title">Dashboard</h1>
        <div class="topbar-right">
          <button class="btn btn-ghost" id="quick-sync" title="Fetch new leads from Google Sheet">⟳ Sync leads</button>
          <div class="user-menu" id="user-menu"></div>
        </div>
      </header>
      <section class="view" id="view"></section>
    </main>
  </div>

  <!-- Lead drawer -->
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>

  <!-- Modal -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="js/store.js"></script>
  <script src="js/integrations.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
